[project]
name = "experiment-template"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "experimaestro>=1.7.1",
]

[dependency-groups]
dev = [
    "pre-commit>=4.2.0",
    "ruff>=0.14.11",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "C90", "B", "T20", "FIX"]
ignore = ["E203", "E266", "E501", "W503"]

[tool.ruff.lint.mccabe]
max-complexity = 18
