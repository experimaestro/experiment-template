name: Check template

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: ${{ matrix.flavor }} (${{ matrix.os }}, mlboard=${{ matrix.mlboard }}${{ matrix.carbon && ', carbon' || '' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, flavor: basic, mlboard: "[]", carbon: false}
          - {os: macos-latest, flavor: basic, mlboard: "[]", carbon: false}
          - {os: ubuntu-latest, flavor: basic, mlboard: "[tensorboard, tables]", carbon: true}
          - {os: ubuntu-latest, flavor: torch, mlboard: "[tensorboard]", carbon: false}
          - {os: ubuntu-latest, flavor: ir, mlboard: "[tensorboard, tables, wandb]", carbon: false}

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Generate a project and run its experiments
        timeout-minutes: 30
        run: |
          scripts/check-template.sh ${{ matrix.flavor }} --mlboard '${{ matrix.mlboard }}' ${{ matrix.carbon && '--carbon' || '' }}
